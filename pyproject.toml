[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nids-verify-personal"
version = "0.1.0"
description = "Network Intrusion Detection System with Adversarial Training"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "mlflow>=2.8.0",
    "onnx>=1.14.0",
    "psutil>=5.9.0",
    "tqdm>=4.67.1",
    "scapy>=2.6.1",
    "torch>=2.2.0",
    "lightning>=2.6.1",
    "loguru>=0.7.3",
    "vehicle-lang",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.5.0",
    "ipykernel>=6.25.0",
]

[project.scripts]
nids-train = "src.main:main"
nids-preprocess = "src.preprocess_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100
known_first_party = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    "dist",
    "build",
    ".venv",
    "data",
    "models",
    "logs",
    "mlruns",
    "vehicle",
    "cloned_vehicle",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "B905",  # zip() without an explicit strict= parameter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.uv.sources]
vehicle-lang = { workspace = true }

[tool.uv.workspace]
members = [
    "cloned_vehicle/vehicle-python",
]
